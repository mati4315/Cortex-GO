<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Overlay de Clima y Tiempo · Cortex Go</title>
  <link rel="stylesheet" href="/modules/clima/css/overlay.css">
</head>
<body data-weather-client="overlay">
  <main id="widget" class="widget-container layout-card pos-top-left preset-classic" aria-live="polite">
    <div class="top-bar"><span id="location-name" class="anim-text">Cargando…</span></div>
    <div class="bottom-bar">
      <div id="content" class="content anim-text">
        <img id="flag" class="flag" alt="" aria-hidden="true" decoding="async">
        <span id="weather-icon" class="weather-icon" aria-hidden="true"></span>
        <span id="value" class="value">--:--</span>
      </div>
    </div>
    <div id="live-bar" class="live-bar"><span class="live-dot"></span><span id="live-text">EN VIVO</span></div>
  </main>
  <script src="/modules/clima/js/overlay.js"></script>
</body>
</html>
